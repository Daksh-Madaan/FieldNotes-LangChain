[project]
name = "fieldnotes-langchain"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daksh Madaan", email = "65502702+Daksh-Madaan@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.4.2",
    "langgraph>=1.2.18",
    "python-dotenv>=1.2.4",
]

[project.scripts]
fieldnotes-langchain = "fieldnotes_langchain:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
